    <script>
      // Suppress benign third-party browser extension errors (e.g. MetaMask, Web3 wallet injection)
      (function() {
        function isExtensionError(msg, src) {
          if (!msg && !src) return false;
          var str = (String(msg) + ' ' + String(src)).toLowerCase();
          return (
            str.indexOf('metamask') !== -1 ||
            str.indexOf('ethereum') !== -1 ||
            str.indexOf('chrome-extension://') !== -1 ||
            str.indexOf('moz-extension://') !== -1 ||
            str.indexOf('safari-extension://') !== -1 ||
            str.indexOf('evm') !== -1
          );
        }

        window.addEventListener('error', function(event) {
          if (isExtensionError(event.message, event.filename)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var message = (reason && (reason.message || reason.stack || String(reason))) || '';
          if (isExtensionError(message)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
